name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.0'
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -sSL -o /tmp/dart-sass.tar.gz \
            https://github.com/sass/dart-sass/releases/download/1.83.4/dart-sass-1.83.4-linux-x64.tar.gz
          sudo tar -xzf /tmp/dart-sass.tar.gz -C /usr/local/lib
          sudo ln -sf /usr/local/lib/dart-sass/sass /usr/local/bin/sass
          sass --version

      - name: Update CV
        run: |
          mkdir -p static/cv/ygc
          curl -o static/cv/ygc/index.html https://raw.githubusercontent.com/GuangchuangYu/cv/master/index.html

      - name: Build site
        run: hugo --gc --minify

      - name: Copy CNAME
        run: cp CNAME public/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
